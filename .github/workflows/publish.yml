name: Compile articles and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oblivionis-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test article compiler
        run: python3 -m unittest -v test_compiler.py
      - name: Compile and validate articles
        run: python3 compiler.py --build _site
      - name: Validate LaTeX
        run: node validate-math.cjs _site/compiled-articles.json
      - name: Test website integration
        run: node test-render.cjs
      - name: Remove validation data
        run: rm _site/compiled-articles.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
