<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<title>Inclined plane with block A and a movable pulley supporting block B</title>
<desc>A rope connects block A on a fixed inclined plane to a movable pulley carrying B, and is anchored to the ceiling. The incline angle is theta and B is at height h.</desc>
