 <!-- Fixed pulley bracket and wheel -->
 <path d="M865 275 890.9653 230.3722"/>
 <circle cx="897" cy="220" r="12"/>
 <!-- Rope: A, upper pulley, moving pulley, ceiling -->
 <path d="M363 526 890.8319 209.7066 A12 12 0 0 1 909 220V455 A28 28 0 0 0 965 455V87"/>
 <circle cx="937" cy="455" r="28"/>
 <path d="M937 455V525"/>
 <!-- Ceiling attachment -->
 <path d="M965 65V75 C980 75 977 91 966 91 C957 91 954 84 959 80"/>
 <!-- Block A, rotated parallel to incline -->
 <g transform="translate(302 605) rotate(-30.42)"><rect x="0" y="-76" width="94" height="76" fill="#d5d5d5"/></g>
 <!-- Block B -->
 <rect x="903" y="525" width="70" height="55" fill="#d5d5d5"/>
 <!-- Angle -->
 <path d="M188 730 A98 98 0 0 0 174.5 680.4"/>
 <!-- Height dimension -->
 <path d="M989 580H1068" stroke-width="1.8"/>
 <path d="M1035 585V630" stroke-width="1.8" marker-start="url(#arrow)"/>
 <path d="M1035 683V725" stroke-width="1.8" marker-end="url(#arrow)"/>
</g>
<g fill="#333" font-family="'Times New Roman',serif" font-size="46">
 <text x="254" y="509">A</text><text x="991" y="560">B</text>
 <text x="207" y="716" font-style="italic">θ</text>
 <text x="1020" y="675" font-style="italic">h</text>
</g>
